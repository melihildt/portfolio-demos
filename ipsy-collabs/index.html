<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Collabs Carousel</title>
<style>
  :root{--bg:#1f1b15;--ink:#efe6dd;--dim:rgba(239,230,221,.55)}
  *{box-sizing:border-box;margin:0}
  html,body{height:100%;background:var(--bg);overflow:hidden;font-family:ui-sans-serif,system-ui,-apple-system,sans-serif;color:var(--ink)}
  #stage{position:absolute;left:50%;top:50%;width:2784px;height:1600px;transform-origin:0 0;user-select:none;cursor:pointer}
  .abs{position:absolute;will-change:transform;backface-visibility:hidden}
  #label{left:139px;top:790px;width:646px;height:52px}
  .photo{left:867px;top:332px;width:708px;height:936px;border-radius:56px;object-fit:cover;background:#ddd}
  .title{left:1701px}
  #ui{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);display:flex;gap:6px;align-items:center;padding:6px;border-radius:999px;background:rgba(255,255,255,.07);backdrop-filter:blur(12px);opacity:0;transition:opacity .3s;z-index:5}
  body:hover #ui,#ui:focus-within{opacity:1}
  #ui button{all:unset;cursor:pointer;width:34px;height:34px;display:grid;place-items:center;border-radius:50%;font-size:14px;color:var(--ink)}
  #ui button:hover{background:rgba(255,255,255,.12)}
  #ui button:focus-visible{outline:2px solid var(--ink)}
  #dots{display:flex;gap:6px;padding:0 6px}
  #dots i{width:6px;height:6px;border-radius:50%;background:var(--dim);transition:all .3s}
  #dots i.on{background:var(--ink);width:18px;border-radius:3px}
  #panel{position:fixed;right:20px;bottom:20px;width:250px;padding:14px 16px;border-radius:14px;background:rgba(20,17,13,.85);backdrop-filter:blur(14px);border:1px solid rgba(255,255,255,.1);font-size:12px;display:none;z-index:6}
  #panel.open{display:block}
  #panel label{display:grid;grid-template-columns:1fr 46px;gap:2px 8px;margin-bottom:10px;color:var(--dim)}
  #panel label input{grid-column:1/3;accent-color:#efe6dd}
  #panel select{width:100%;margin-bottom:6px;background:#2a251d;color:var(--ink);border:1px solid rgba(255,255,255,.15);border-radius:6px;padding:4px}
  #panel b{display:block;margin-bottom:10px;font-weight:600}
  #panel small{color:var(--dim)}
  html.embed #ui,html.embed #panel{display:none}
  html.embed #stage{cursor:default}
</style>
</head>
<body>
<div id="stage">
  <img id="label" class="abs" alt="Collaborations with">
</div>

<div id="ui">
  <button id="prev" aria-label="Previous">◀</button>
  <button id="play" aria-label="Pause">❚❚</button>
  <button id="next" aria-label="Next">▶</button>
  <div id="dots"></div>
  <button id="gear" aria-label="Motion settings">⚙</button>
</div>

<div id="panel">
  <b>Motion</b>
  <select id="ease">
    <option value="0.76,0,0.16,1">Silk (default)</option>
    <option value="0.65,0,0.35,1">Smooth in-out</option>
    <option value="0.87,0,0.13,1">Expo in-out</option>
    <option value="0.5,0,0.1,1">Soft launch</option>
    <option value="0.33,0,0.67,1">Sine (gentle)</option>
  </select>
  <label>Move <span id="vMove"></span><input id="move" type="range" min="0.6" max="2.2" step="0.05" value="1.25"></label>
  <label>Hold <span id="vHold"></span><input id="hold" type="range" min="0.3" max="3" step="0.05" value="1.3"></label>
  <label>Name lag <span id="vLag"></span><input id="lag" type="range" min="0" max="0.3" step="0.01" value="0.09"></label>
  <small>Space pause · ←/→ step · click to advance · G panel</small>
</div>

<script>
// Embed mode: ?embed in the URL, or running inside an iframe (e.g. Framer's Embed) -> no player bar or tweak panel
try{ if(new URLSearchParams(location.search).has('embed') || self!==top) document.documentElement.classList.add('embed'); }
catch(e){ document.documentElement.classList.add('embed'); }
const BASE = "https://cdn.jsdelivr.net/gh/melihildt/portfolio-demo-assets@fb5fb62898370793d5f61e2569fc54d67b9b7f43/ipsy-collabs/";
const DATA = {
 "items": [
  {
   "name": "Alicia Keys",
   "photo": "photo-01.webp",
   "title": "title-01.png",
   "tw": 570,
   "th": 142
  },
  {
   "name": "Gwen Stefani",
   "photo": "photo-02.webp",
   "title": "title-02.png",
   "tw": 692,
   "th": 142
  },
  {
   "name": "Vanessa Hudgens",
   "photo": "photo-03.webp",
   "title": "title-03.png",
   "tw": 916,
   "th": 142
  },
  {
   "name": "Addison Rae",
   "photo": "photo-04.webp",
   "title": "title-04.png",
   "tw": 650,
   "th": 142
  },
  {
   "name": "John Legend & Chrissy Teigen",
   "photo": "photo-05.webp",
   "title": "title-05.png",
   "tw": 764,
   "th": 284
  },
  {
   "name": "Pat McGrath",
   "photo": "photo-06.webp",
   "title": "title-06.png",
   "tw": 658,
   "th": 142
  },
  {
   "name": "Madelaine Petsch",
   "photo": "photo-07.webp",
   "title": "title-07.png",
   "tw": 916,
   "th": 142
  }
 ],
 "label": "label.png"
};
const N = DATA.items.length, W = 2784, H = 1600, PITCH = 1650, TITLE_CY = 813;
const stage = document.getElementById('stage');
document.getElementById('label').src = BASE + DATA.label;

const photos = [], titles = [];
DATA.items.forEach((it,i)=>{
  const p = new Image(); p.className='abs photo'; p.src=BASE+it.photo; p.alt=it.name; p.draggable=false;
  const t = new Image(); t.className='abs title'; t.src=BASE+it.title; t.alt=''; t.draggable=false;
  t.style.width=it.tw+'px'; t.style.height=it.th+'px'; t.style.top=(TITLE_CY-it.th/2)+'px';
  stage.append(p,t); photos.push(p); titles.push(t);
});
const dots = document.getElementById('dots');
DATA.items.forEach(()=>dots.append(document.createElement('i')));

// cubic-bezier easing (same solver as CSS)
function bezier(x1,y1,x2,y2){
  const cx=3*x1,bx=3*(x2-x1)-cx,ax=1-cx-bx,cy=3*y1,by=3*(y2-y1)-cy,ay=1-cy-by;
  const X=t=>((ax*t+bx)*t+cx)*t, Y=t=>((ay*t+by)*t+cy)*t, dX=t=>(3*ax*t+2*bx)*t+cx;
  return x=>{ if(x<=0)return 0; if(x>=1)return 1; let t=x;
    for(let i=0;i<8;i++){const e=X(t)-x; if(Math.abs(e)<1e-6)break; const d=dX(t); if(Math.abs(d)<1e-6)break; t-=e/d;}
    let lo=0,hi=1; if(t<lo||t>hi){t=x; for(let i=0;i<24;i++){const v=X(t); if(Math.abs(v-x)<1e-6)break; v<x?lo=t:hi=t; t=(lo+hi)/2;}}
    return Y(t); };
}

const S = {move:1.25, hold:1.3, lag:0.09, ease:bezier(.76,0,.16,1)};


// Timeline state: at rest on item `from`, or travelling from -> to.
// `t` = seconds since the move started. Photo leads; the name follows `lag` seconds later.
const st = {from:0, to:0, t:0, moving:false, wait:0};
let playing = true;

const prog = t => S.ease(Math.min(1, Math.max(0, t/S.move)));   // 0..1 of one move
function wrap(d){ d = ((d % N)+N)%N; return d>N/2 ? d-N : d; }

function render(){
  const dp = st.to-st.from;
  const pp = st.from + dp*prog(st.t), pt = st.from + dp*prog(st.t - S.lag);
  for(let i=0;i<N;i++){
    const yp = wrap(i-pp)*PITCH, yt = wrap(i-pt)*PITCH;
    photos[i].style.transform = `translate3d(0,${yp.toFixed(2)}px,0)`;
    titles[i].style.transform = `translate3d(0,${yt.toFixed(2)}px,0)`;
    photos[i].style.visibility = Math.abs(yp)>H ? 'hidden':'visible';   // keep off-screen layers out of the compositor
    titles[i].style.visibility = Math.abs(yt)>H ? 'hidden':'visible';
  }
  const cur = ((Math.round(pp)%N)+N)%N;
  [...dots.children].forEach((d,i)=>d.classList.toggle('on',i===cur));
}

function startMove(dir){ if(st.moving) return; st.from=st.to; st.to=st.from+dir; st.t=0; st.moving=true; }

let last = performance.now();
function frame(now){
  const dt = Math.min(0.05,(now-last)/1000); last = now;
  if(st.moving){
    st.t += dt;
    if(st.t >= S.move+S.lag){ st.from=st.to; st.t=0; st.moving=false; st.wait=0; }   // settle on integer index (no drift)
  } else if(playing){
    st.wait += dt;
    if(st.wait >= S.hold) startMove(1);
  }
  render(); requestAnimationFrame(frame);
}

function fit(){
  const s = Math.min(innerWidth/W, innerHeight/H);
  stage.style.transform = `scale(${s}) translate(${-W/2}px,${-H/2}px)`;
}
addEventListener('resize',fit); fit();

// ---- controls
const $ = id=>document.getElementById(id);
function setPlay(v){ playing=v; st.wait=0; $('play').textContent = v?'❚❚':'▶'; $('play').setAttribute('aria-label',v?'Pause':'Play'); }
setPlay(playing);
$('play').onclick = e=>{e.stopPropagation(); setPlay(!playing)};
$('prev').onclick = e=>{e.stopPropagation(); startMove(-1)};
$('next').onclick = e=>{e.stopPropagation(); startMove(1)};
$('gear').onclick = e=>{e.stopPropagation(); $('panel').classList.toggle('open')};
stage.onclick = ()=>{ if(!document.documentElement.classList.contains('embed')) startMove(1); };
addEventListener('keydown',e=>{
  if(document.documentElement.classList.contains('embed')) return;
  if(e.key==='ArrowRight'||e.key==='ArrowDown')startMove(1);
  else if(e.key==='ArrowLeft'||e.key==='ArrowUp')startMove(-1);
  else if(e.key===' '){e.preventDefault(); setPlay(!playing)}
  else if(e.key.toLowerCase()==='g')$('panel').classList.toggle('open');
});
function bind(id,key,out){ const el=$(id); const u=()=>{ S[key]=+el.value; $(out).textContent=S[key].toFixed(2)+'s'; }; el.oninput=u; u(); }
bind('move','move','vMove'); bind('hold','hold','vHold'); bind('lag','lag','vLag');
$('ease').onchange = e=>{ S.ease = bezier(...e.target.value.split(',').map(Number)); };

render(); requestAnimationFrame(frame);
</script>
</body>
</html>
